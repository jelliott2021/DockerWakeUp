<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{route}} is waking up</title>
<!--
  Example custom wake page for DockerWakeUp.

  Point to this file with the "wakePage" option in config.json
  (globally, or per-service). {{route}} is replaced with the
  service's route name when served.

  Two endpoints are available to your page (same-origin):
    GET  __wake/status  ->  { state, ready, startedAt, error }
                            state: "idle" | "starting" | "ready" | "failed"
                            ready: true once the service answers HTTP
    GET  __wake/logs    ->  Server-Sent Events stream of
                            `docker compose logs -f` (one line per event,
                            JSON-encoded string)

  Use the prefix logic below so the page works both behind nginx and
  when hitting the wake proxy directly.
-->
<style>
  body {
    margin: 0; min-height: 100vh;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    background: #1a1b26; color: #c0caf5;
    font-family: system-ui, sans-serif;
    text-align: center; padding: 2rem;
  }
  h1 { font-weight: 600; }
  .dots::after { content: ""; animation: dots 1.5s steps(4) infinite; }
  @keyframes dots { 0% { content: ""; } 25% { content: "."; } 50% { content: ".."; } 75% { content: "..."; } }
  pre {
    text-align: left; background: #16161e; border-radius: 8px;
    padding: 1rem; max-width: 700px; width: 100%; height: 240px;
    overflow-y: auto; font-size: 0.75rem; white-space: pre-wrap; word-break: break-all;
  }
</style>
</head>
<body>
  <h1>☕ Hang tight — {{route}} is waking up<span class="dots"></span></h1>
  <p>The page will load automatically when it's ready.</p>
  <pre id="log"></pre>
  <script>
    var route = "{{route}}";
    var prefix = location.pathname.indexOf("/proxy/" + route) === 0 ? "/proxy/" + route : "";
    var base = prefix + "/__wake";
    var logEl = document.getElementById("log");

    var es = new EventSource(base + "/logs");
    es.onmessage = function (ev) {
      var atBottom = logEl.scrollTop + logEl.clientHeight >= logEl.scrollHeight - 10;
      try { logEl.textContent += JSON.parse(ev.data) + "\n"; } catch (e) { logEl.textContent += ev.data + "\n"; }
      if (atBottom) logEl.scrollTop = logEl.scrollHeight;
    };

    (function poll() {
      fetch(base + "/status", { cache: "no-store" })
        .then(function (r) { return r.json(); })
        .then(function (st) {
          if (st.ready) { es.close(); location.reload(); return; }
          setTimeout(poll, 2000);
        })
        .catch(function () { setTimeout(poll, 2000); });
    })();
  </script>
</body>
</html>
