# Example caddy-docker-proxy stack that fronts DockerWakeUp
# (https://github.com/lucaslorentz/caddy-docker-proxy).
#
# Caddy runs with HOST networking on purpose. The wake proxy listens on the
# host (proxyPort in config.json, 8080 by default), and on a stock Ubuntu with
# ufw enabled a container on a bridge network can NOT reach host ports at all —
# packets are silently dropped and every request ends in a 502. With host
# networking Caddy reaches the wake proxy on 127.0.0.1, binds 80/443 directly,
# and still reaches your other labelled containers over the "caddy" network.
# Nothing to open in the firewall. The extra_hosts line maps
# host.docker.internal (the generator's default upstream) to 127.0.0.1 so the
# generated config works unchanged.
#
# Already have Caddy on a bridge network and want to keep it that way? Then
# instead give it extra_hosts "host.docker.internal:host-gateway" AND allow the
# proxy port from the Docker networks in your firewall — the README checklist
# (and setup-service.sh) print the exact commands.
#
# Two ways to hand the DockerWakeUp sites to Caddy — pick one:
#
#   A) Labels — DockerWakeUp itself runs with Docker. Nothing extra is needed
#      here; in the DockerWakeUp directory generate the labels and start it:
#        docker compose run --rm caddy-generator
#        docker compose up -d --build
#      (the generated docker-compose.override.yml is loaded automatically)
#
#   B) Base Caddyfile — DockerWakeUp runs via SystemD/PM2 (no container to
#      label). The two CADDY_DOCKER_CADDYFILE_PATH lines below must be enabled
#      (setup-service.sh writes caddy-generator/caddy-stack.yml with that done);
#      the generated Caddyfile is re-read whenever caddy-docker-proxy regenerates
#      its config (on Docker events, and every 30s by default).
#
# Create the ingress network once — other containers you label later join it:
#   docker network create caddy

services:
  caddy:
    image: lucaslorentz/caddy-docker-proxy:ci-alpine
    container_name: caddy
    restart: unless-stopped
    # binds 80, 443/tcp and 443/udp on the host directly — no `ports:` needed
    network_mode: host
    environment:
      - CADDY_INGRESS_NETWORKS=caddy
      # B) base Caddyfile generated by caddy-generator:
      # - CADDY_DOCKER_CADDYFILE_PATH=/etc/caddy/docker-wakeup.Caddyfile
    extra_hosts:
      - "host.docker.internal:127.0.0.1"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - caddy_data:/data
      # B) base Caddyfile generated by caddy-generator:
      # - /path/to/DockerWakeUp/caddy-generator/Caddyfile:/etc/caddy/docker-wakeup.Caddyfile:ro

volumes:
  caddy_data: {}
