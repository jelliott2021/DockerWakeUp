# Example of what the generator produces, and how to keep hand edits.
#
# Option 1: put custom lines between the custom-start/custom-end markers —
# they are carried over every time the generator regenerates this file.
#
# Option 2: add a line containing exactly
#     # wakeup:manual
# anywhere in a conf, and the generator will never touch that file again.
#
# (This example.conf itself is documentation only — it is never symlinked
# into /etc/nginx/sites-enabled.)

server {
    listen 80;
    server_name myservice.example.com;

    location / {
        # custom-start (lines between these markers survive regeneration)
        auth_basic "Restricted";
        auth_basic_user_file /path/to/.htpasswd;
        # custom-end

        proxy_pass http://127.0.0.1:8080/proxy/myservice/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_request_buffering off;
    }
}
