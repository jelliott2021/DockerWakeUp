# Weekly dependency updates, grouped so one PR covers the routine bumps.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      dev-tooling:
        patterns: ["*"]
        update-types: [minor, patch]
  - package-ecosystem: npm
    directory: /wake-proxy
    schedule:
      interval: weekly
    groups:
      wake-proxy:
        patterns: ["*"]
        update-types: [minor, patch]
  - package-ecosystem: npm
    directory: /proxy-generator
    schedule:
      interval: weekly
    groups:
      proxy-generator:
        patterns: ["*"]
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
